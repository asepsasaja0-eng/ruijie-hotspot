<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruijie Hotspot - Login Berhasil</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, Helvetica, sans-serif;
        background:
            radial-gradient(circle at 20% 20%, rgba(255,255,255,.12), transparent 30%),
            linear-gradient(135deg, #111827, #1f2937 55%, #0f172a);
        color: #fff;
        padding: 20px;
    }
    .card {
        width: 100%;
        max-width: 430px;
        background: rgba(255,255,255,.08);
        border: 1px solid rgba(255,255,255,.15);
        border-radius: 24px;
        padding: 34px 28px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0,0,0,.35);
        backdrop-filter: blur(12px);
    }
    .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        color: #111827;
        font-size: 28px;
        font-weight: 800;
    }
    h1 { margin: 0 0 8px; font-size: 27px; }
    .subtitle { color: #cbd5e1; margin: 0 0 26px; }
    .success {
        font-size: 52px;
        margin-bottom: 8px;
    }
    .info {
        text-align: left;
        background: rgba(0,0,0,.18);
        border-radius: 16px;
        padding: 16px;
        margin: 20px 0;
    }
    .row {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        padding: 8px 0;
        border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .row:last-child { border-bottom: 0; }
    .label { color: #94a3b8; }
    .value { font-weight: 700; }
    .online { color: #4ade80; }
    .countdown {
        font-size: 15px;
        color: #cbd5e1;
        margin: 18px 0;
    }
    #seconds {
        color: #fff;
        font-size: 22px;
        font-weight: 800;
    }
    button {
        width: 100%;
        border: 0;
        border-radius: 13px;
        padding: 14px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        background: #fff;
        color: #111827;
    }
    button:hover { opacity: .9; }
    .note {
        margin-top: 16px;
        font-size: 12px;
        color: #94a3b8;
    }
</style>
</head>

<body>
<div class="card">
    <div class="logo">RH</div>

    <div class="success">✓</div>
    <h1>Login Berhasil!</h1>
    <p class="subtitle">Selamat, perangkat kamu sudah terhubung.</p>

    <div class="info">
        <div class="row">
            <span class="label">Voucher</span>
            <span class="value">5000-ABC123</span>
        </div>
        <div class="row">
            <span class="label">Masa aktif</span>
            <span class="value">24 Jam</span>
        </div>
        <div class="row">
            <span class="label">Status</span>
            <span class="value online">● Online</span>
        </div>
    </div>

    <div class="countdown">
        Mengarahkan ke internet dalam
        <span id="seconds">5</span> detik...
    </div>

    <button onclick="goNow()">Mulai Internet</button>

    <div class="note">
        Ruijie Hotspot • Koneksi cepat untuk gaming, streaming & download
    </div>
</div>

<script>
let seconds = 5;
const counter = document.getElementById("seconds");

const timer = setInterval(() => {
    seconds--;
    counter.textContent = seconds;

    if (seconds <= 0) {
        clearInterval(timer);
        goNow();
    }
}, 1000);

function goNow() {
    // Untuk simulasi, kita tidak benar-benar keluar dari halaman.
    // Nanti URL ini bisa diganti dengan halaman tujuan kamu.
    window.location.href = "https://www.google.com";
}
</script>
</body>
</html>
